plugins {
    id 'com.android.application'
}

android {
    namespace 'com.captionsmith.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.captionsmith.app'
        minSdk 29          // Android 10+
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        // A fixed key so every new build installs over the old one (keeps your projects).
        // Fine for personal sideloading. Make your own private key before publishing to Play.
        release {
            storeFile file('captionsmith.keystore')
            storePassword 'captionsmith'
            keyAlias 'captionsmith'
            keyPassword 'captionsmith'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
