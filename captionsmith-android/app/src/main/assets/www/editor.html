<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181e">
<title>Cutline Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Poppins:wght@700;800;900&family=Anton&family=Bebas+Neue&family=Archivo+Black&family=Bangers&family=Permanent+Marker&family=Lilita+One&display=swap">
<style>
/* Layout: phone-first, CapCut-style. Preview on top, scrubbing timeline with a fixed centre playhead,
   contextual tool row pinned to the bottom, settings slide up as a sheet. Same tokens as the Captions screen. */
:root{
  --bg:#0e1014; --panel:#15181e; --raise:#1d2129; --raise2:#262b35; --line:#2e3440;
  --fg:#e8eaee; --mute:#8d95a5; --dim:#5d6575;
  --accent:#ffc531; --accent-ink:#1b1500; --accent-soft:rgba(255,197,49,.14);
  --danger:#ff6b5e; --ok:#4fd18b; --info:#6fb6ff;
  --c-main:#6fb6ff; --c-ovl:#ff7eb6; --c-text:#ffc531; --c-vfx:#a78bfa; --c-aud:#4fd18b;
  --ui:"Familjen Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:10px;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--ui);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,textarea{-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.modes{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex:none}
.modes a{padding:5px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--mute);text-decoration:none}
.modes a[aria-current]{background:var(--accent);color:var(--accent-ink)}
#projName{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;font-weight:500}
#projName:focus{border-color:var(--line);background:var(--raise)}
.savestate{font-size:11px;color:var(--dim);white-space:nowrap}
.iconbtn{background:var(--raise);border:1px solid var(--line);border-radius:8px;min-width:36px;height:36px;display:inline-grid;place-items:center;padding:0 8px;color:var(--fg);flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn[aria-pressed="true"]{color:var(--accent);border-color:rgba(255,197,49,.5)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{background:var(--raise2);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}

.stage{flex:none;background:var(--bg)}
.viewer{position:relative;display:grid;place-items:center;height:clamp(190px,39vh,560px);padding:8px 12px 0}
#preview{display:block;background:#000;border-radius:6px;max-width:100%;max-height:100%;touch-action:none}
.selbox{position:absolute;border:1.5px solid var(--accent);border-radius:4px;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.selbox i{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.selbox i.br{right:-7px;bottom:-7px}
.transport{display:flex;align-items:center;gap:8px;padding:8px 12px 6px}
#playBtn{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;flex:none}
#playBtn svg{width:19px;height:19px;fill:currentColor;stroke:none}
.tc{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tc span{color:var(--mute)}
.grow{flex:1}

/* timeline */
.tlsec{flex:1;min-height:120px;position:relative;background:var(--panel);border-top:1px solid var(--line)}
#tlScroll{position:absolute;inset:0;overflow-x:auto;overflow-y:auto;scrollbar-width:none;touch-action:pan-x pan-y}
#tlScroll::-webkit-scrollbar{display:none}
#tlInner{position:relative;min-height:100%}
.ruler{height:24px;position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:1px solid var(--line)}
.ruler span{position:absolute;top:5px;font-family:var(--mono);font-size:10px;color:var(--dim);transform:translateX(-50%)}
.ruler b{position:absolute;bottom:0;width:1px;height:5px;background:var(--dim)}
.ruler em{position:absolute;bottom:0;width:2px;height:8px;background:var(--c-aud);border-radius:1px}
.track{position:relative;margin:6px 0}
.track .lane{position:relative;height:30px;margin-bottom:3px}
.track.main .lane{height:54px}
.tag{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);pointer-events:none;white-space:nowrap}
.item{position:absolute;top:0;bottom:0;border-radius:6px;overflow:hidden;touch-action:none;
  background:color-mix(in srgb,var(--c) 22%,var(--raise));border:1px solid color-mix(in srgb,var(--c) 70%,transparent);display:flex;align-items:center}
.item .nm{position:relative;padding:0 10px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none}
.item.main{--c:var(--c-main);background:#000}
.item.ovl{--c:var(--c-ovl)} .item.text{--c:var(--c-text)} .item.vfx{--c:var(--c-vfx)} .item.aud{--c:var(--c-aud)}
.item .strip{position:absolute;inset:0;background-repeat:repeat-x;background-size:auto 100%;opacity:.85;pointer-events:none}
.item canvas{position:absolute;left:0;top:0;height:100%;pointer-events:none;opacity:.75}
.item.main .nm{position:absolute;left:0;bottom:2px;font-size:10.5px}
.item.sel{border-color:#fff;box-shadow:0 0 0 2px #fff;z-index:3}
.item .hd{position:absolute;top:0;bottom:0;width:16px;display:none;z-index:2;background:#fff;align-items:center;justify-content:center}
.item .hd::after{content:"";width:2px;height:40%;border-radius:1px;background:var(--bg)}
.item.sel .hd{display:flex}
.item .hd.l{left:0;border-radius:5px 0 0 5px} .item .hd.r{right:0;border-radius:0 5px 5px 0}
.item .kb{position:absolute;right:6px;top:4px;font-size:9px;font-weight:700;background:rgba(0,0,0,.6);border-radius:4px;padding:1px 4px;pointer-events:none}
.tchip{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;z-index:4;color:var(--mute);padding:0}
.tchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tchip svg{width:12px;height:12px}
.addend{position:absolute;top:9px;width:36px;height:36px;border-radius:8px;background:var(--fg);color:var(--bg);border:0;display:grid;place-items:center}
.playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;z-index:6;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.playhead::before{content:"";position:absolute;top:0;left:-5px;width:12px;height:8px;background:#fff;clip-path:polygon(0 0,100% 0,50% 100%)}

/* tool row + sheet */
.toolbar{flex:none;display:flex;overflow-x:auto;gap:2px;padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tool{flex:none;min-width:64px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;border-radius:8px;font-size:11px;font-weight:600;color:var(--mute)}
.tool svg.i{width:22px;height:22px;color:var(--fg)}
.tool:active{background:var(--raise)}
.tool.hot svg.i{color:var(--accent)}
.tool.back{border-right:1px solid var(--line);border-radius:0;margin-right:4px}
.sheet{position:absolute;left:0;right:0;top:0;bottom:0;z-index:20;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:10px 14px 8px}
.sheet-h b{flex:1;font-size:15px}
.sheet-b{overflow-y:auto;padding:4px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{margin:0;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600}
.note{font-size:13px;color:var(--mute);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.opt{background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--fg);min-width:0}
.opt canvas{width:100%;aspect-ratio:1;border-radius:6px;background:#000;display:block}
.opt span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.field{display:grid;grid-template-columns:96px 1fr 50px;gap:8px;align-items:center;min-height:34px}
.field>label{font-size:13px;color:var(--mute)}
.field .val{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field.wide{grid-template-columns:96px 1fr}
.input,.sheet select,.sheet textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.sheet textarea{resize:vertical;min-height:70px;line-height:1.4}
input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;background:none;border:0;border-radius:7px;padding:7px 8px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raise2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.seg.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:none}
.seg.chips::-webkit-scrollbar{display:none}
.seg.chips button{flex:none;padding:7px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;font-size:14px}
.tog input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:var(--raise2);border:1px solid var(--line);position:relative;flex:none;margin:0}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:transform .15s}
.tog input:checked{background:var(--accent);border-color:var(--accent)}
.tog input:checked::after{transform:translateX(18px);background:var(--accent-ink)}
.sfxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sfxt{position:relative;display:flex;align-items:stretch;background:var(--raise);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.sfxt .pv{flex:1;min-width:0;background:none;border:0;padding:8px 6px 7px 10px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:4px 6px;text-align:left;position:relative}
.sfxt .pv canvas{grid-column:1/-1;width:100%;height:28px;opacity:.75}
.sfxt .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sfxt .du{font-family:var(--mono);font-size:11px;color:var(--mute);align-self:center}
.sfxt .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--c-aud)}
.sfxt.playing{border-color:var(--c-aud);box-shadow:0 0 0 1px var(--c-aud)}
.sfxt.playing canvas{opacity:1}
.sfxt .add{flex:none;width:44px;border:0;border-left:1px solid var(--line);background:var(--raise2);color:var(--fg);display:grid;place-items:center}
.sfxt .add:active{background:var(--accent);color:var(--accent-ink)}
.sfxt.added .add{animation:addflash .6s ease-out}
@keyframes addflash{0%{background:var(--accent);color:var(--accent-ink)}100%{background:var(--raise2);color:var(--fg)}}
.medialist{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mtile{position:relative;background:var(--raise);border:1px solid var(--line);border-radius:9px;overflow:hidden;padding:0;text-align:left}
.mtile .th{aspect-ratio:1;background:#000 center/cover no-repeat;display:block}
.mtile .mm{display:block;padding:5px 7px;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile .du{position:absolute;right:5px;top:5px;font-family:var(--mono);font-size:10px;background:rgba(0,0,0,.7);border-radius:4px;padding:1px 5px}
.progress{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.oknote{font-size:13px;margin:0;padding:9px 11px;border-radius:8px;background:rgba(79,209,139,.1);border:1px solid rgba(79,209,139,.3);color:#bfeed4}
.warnnote{font-size:13px;margin:0;padding:9px 11px;border-radius:8px;background:rgba(255,107,94,.1);border:1px solid rgba(255,107,94,.35);color:#ffc2bc}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);z-index:50;background:#2a303b;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.err{border-color:var(--danger);background:#3a2020}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px}
.modal .card{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:16px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px}
.modal video{width:100%;max-height:50vh;border-radius:6px;background:#000}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#vpool{position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none}
@media (max-width:440px){
  .savestate{display:none}
  .transport{gap:6px}
  .transport .iconbtn{min-width:34px;height:34px;padding:0 6px}
  .tc{font-size:12px}
}
@media (min-width:900px){
  .viewer{height:clamp(240px,48vh,640px)}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="fxDefs"></defs></svg>
<div id="app">
  <header class="topbar">
    <nav class="modes" aria-label="Screens"><a aria-current="page">Edit</a><a href="index.html">Captions</a></nav>
    <input id="projName" aria-label="Project name" value="Untitled edit">
    <span class="savestate" id="saveState"></span>
    <button class="btn primary small" id="exportBtn">Export</button>
  </header>

  <section class="stage" aria-label="Preview">
    <div class="viewer" id="viewer"><canvas id="preview" aria-label="Video preview"></canvas><div class="selbox" id="selBox" hidden><i class="br"></i></div></div>
    <div class="transport">
      <button id="playBtn" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l13-7.5z"/></svg></button>
      <span class="tc" id="timeNow">00:00.0 <span>/ 00:00.0</span></span>
      <span class="grow"></span>
      <button class="iconbtn" id="undoBtn" aria-label="Undo" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="iconbtn" id="redoBtn" aria-label="Redo" disabled><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="iconbtn" id="snapBtn" aria-label="Snap to beats and edges" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M6 7h4M14 7h4"/></svg></button>
      <button class="iconbtn" id="fitBtn" aria-label="Fit timeline"><svg class="i" viewBox="0 0 24 24"><path d="M4 12h16M7 9l-3 3 3 3M17 9l3 3-3 3"/></svg></button>
    </div>
  </section>

  <section class="tlsec" id="tlSec">
    <div id="tlScroll"><div id="tlInner"></div></div>
    <div class="playhead"></div>
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-h"><b id="sheetTitle"></b><button class="iconbtn" id="sheetClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></button></div>
      <div class="sheet-b" id="sheetBody"></div>
    </div>
  </section>

  <nav class="toolbar" id="toolbar" aria-label="Tools"></nav>
</div>

<div id="modalHost"></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="fileMedia" accept="video/*,image/*,audio/*" multiple class="sr">
<input type="file" id="fileAudio" accept="audio/*,video/*" class="sr">
<div id="vpool"></div>
<script src="recfix.js"></script>
<script>
'use strict';
/* ============ Utilities ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ANDROID = window.CutlineAndroid || window.CaptionsmithAndroid || null;
const ease = {
  lin: t => t, out: t => 1 - Math.pow(1 - t, 3), in: t => t * t * t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  expo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)
};
function fmt(t) { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0'); }
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); } // stable pseudo-random 0..1
function noise1(t) { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; }
const ICON = {
  add: '<path d="M12 5v14M5 12h14"/>', media: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/>',
  text: '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>', audio: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  vfx: '<path d="m12 3 1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',

function mainDur(c) { return Math.max(.05, (c.out - c.in) / (c.speed || 1)); }
function trDur(i) {
  const a = P.main[i], b = P.main[i + 1]; if (!a || !b || !a.tr || a.tr.type === 'cut') return 0;
  return Math.min(a.tr.d || .3, mainDur(a) * .45, mainDur(b) * .45);
}
function mainLayout() {
  const out = []; let t = 0;
  P.main.forEach((c, i) => { const d = mainDur(c); out.push({ c, i, start: t, end: t + d }); t = t + d - trDur(i); });
  return out;
}
function itemStart(track, it) { if (track === 'main') { const l = mainLayout().find(x => x.c === it); return l ? l.start : 0; } return it.start; }
function itemDur(track, it) { return track === 'main' ? mainDur(it) : it.dur; }
function duration() {
  let e = 0; const L = mainLayout(); if (L.length) e = L[L.length - 1].end;
  ['ovl', 'text', 'vfx', 'aud'].forEach(k => P[k].forEach(it => e = Math.max(e, it.start + it.dur)));
  return e;
}
function findItem(s) { return s && P[s.track] ? P[s.track].find(x => x.id === s.id) : null; }
function selItem() { return findItem(sel); }
function outDims() { const [w, h] = ASPECTS[P.aspect] || ASPECTS['9:16']; const k = P.res / Math.min(w, h); return { w: Math.round(w * k / 2) * 2, h: Math.round(h * k / 2) * 2 }; }

const hist = { undo: [], redo: [], key: null, keyT: 0 };

function mutate(fn, key) {
  const now = performance.now();
  if (!key || key !== hist.key || now - hist.keyT > 1200) { hist.undo.push(SNAP()); if (hist.undo.length > 120) hist.undo.shift(); hist.redo = []; }
  hist.key = key || null; hist.keyT = now;
  if (P.demo) P.demo = false;
  fn(); afterChange();
}
function restore(s) { Object.assign(P, JSON.parse(s)); if (sel && !findItem(sel)) sel = null; afterChange(); renderTools(); }
function undo() { if (!hist.undo.length) return; hist.redo.push(SNAP()); restore(hist.undo.pop()); hist.key = null; toast('Undone'); }

let idb = null, idbFailed = false;
function idbOpen() {
  if (idb || idbFailed) return Promise.resolve(idb);
  return new Promise(res => {
    try {
      const r = indexedDB.open('cutline', 1);
      r.onupgradeneeded = () => { ['projects', 'media', 'handoff'].forEach(s => r.result.createObjectStore(s)); };
      r.onsuccess = () => { idb = r.result; res(idb); }; r.onerror = r.onblocked = () => { idbFailed = true; res(null); };
    } catch (e) { idbFailed = true; res(null); }

}
function idbReq(store, mode, fn) { return idbOpen().then(db => db ? new Promise((res, rej) => { try { const tx = db.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r && r.result); tx.onerror = tx.onabort = () => rej(tx.error); } catch (e) { rej(e); } }) : Promise.reject(new Error('storage unavailable'))); }
let saveTimer = 0;
function scheduleSave() { clearTimeout(saveTimer); $('#saveState').textContent = 'Unsaved'; saveTimer = setTimeout(saveNow, 900); }
async function saveNow() {
  clearTimeout(saveTimer); if (P.demo) { $('#saveState').textContent = 'Example'; return; }
  P.updated = Date.now(); const data = JSON.parse(SNAP()); data.id = P.id; data.updated = P.updated; data.cutline = 1; data.fps = P.fps; data.res = P.res;
  try { await idbReq('projects', 'readwrite', s => s.put(data, data.id)); $('#saveState').textContent = 'Saved'; try { localStorage.setItem('cl.last', data.id); } catch (e) { } }
  catch (e) { $('#saveState').textContent = 'Not saved'; }
}
async function listProjects() { try { return ((await idbReq('projects', 'readonly', s => s.getAll())) || []).sort((a, b) => b.updated - a.updated); } catch (e) { return []; } }

/* ============ Media ============ */
const VID_RE = /\.(mp4|m4v|mov|webm|mkv|3gp)$/i, IMG_RE = /\.(png|jpe?g|webp|gif|bmp|avif)$/i, AUD_RE = /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac)$/i;
function kindOf(f) { const t = f.type || ''; if (t.startsWith('video/') || VID_RE.test(f.name)) return 'video'; if (t.startsWith('image/') || IMG_RE.test(f.name)) return 'image'; if (t.startsWith('audio/') || AUD_RE.test(f.name)) return 'audio'; return null; }
function waitEvent(el, ok, bad, ms) { return new Promise((res, rej) => { const t = setTimeout(() => { clean(); rej(new Error('timeout')); }, ms); const a = () => { clean(); res(); }, b = () => { clean(); rej(new Error('error')); }; function clean() { clearTimeout(t); el.removeEventListener(ok, a); if (bad) el.removeEventListener(bad, b); } el.addEventListener(ok, a); if (bad) el.addEventListener(bad, b); }); }
let offlineCtx = null;
function decoder() { if (!offlineCtx) offlineCtx = new OfflineAudioContext(1, 44100, 44100); return offlineCtx; }

function peaksOf(buf, n = 1200) { const d = buf.getChannelData(0), step = Math.max(1, Math.floor(d.length / n)), out = new Float32Array(Math.ceil(d.length / step)); for (let i = 0, j = 0; i < d.length; i += step, j++) { let m = 0; for (let k = i; k < Math.min(d.length, i + step); k += 4) { const v = Math.abs(d[k]); if (v > m) m = v; } out[j] = m; } return { data: out, dur: buf.duration }; }

async function loadMedia(meta, blob) {
  const m = Object.assign({}, meta); media[m.id] = m;
  if (m.kind === 'gen') { m.w = 1080; m.h = 1920; m.ready = true; return m; }
  if (!blob) { m.missing = true; return m; }
  m.blob = blob; m.url = URL.createObjectURL(blob);
  if (m.kind === 'image') {
    const img = new Image(); img.src = m.url; await waitEvent(img, 'load', 'error', 20000);
    m.img = img; m.w = img.naturalWidth; m.h = img.naturalHeight; m.thumbs = [thumbOf(img, m.w, m.h)];
  } else if (m.kind === 'video') {
    const v = document.createElement('video'); v.muted = true; v.preload = 'auto'; v.playsInline = true; v.src = m.url;
    await waitEvent(v, 'loadedmetadata', 'error', 20000); m.w = v.videoWidth; m.h = v.videoHeight; m.dur = v.duration;
    if (!m.w) throw new Error('no picture');
    makeThumbs(m, v);
    if (m.dur < 900) decodeAudio(blob).then(b => { m.buf = b; m.peaks = peaksOf(b); tlDirty = true; }).catch(() => { m.noAudio = true; });
  } else if (m.kind === 'audio') {
    m.buf = await decodeAudio(blob); m.dur = m.buf.duration; m.peaks = peaksOf(m.buf);
  }
  m.ready = true; return m;
}
function thumbOf(src, w, h) { const c = document.createElement('canvas'); const s = 120 / Math.max(w, h); c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s)); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .7); }

  m.thumbs = []; const n = clamp(Math.ceil(m.dur), 2, 24);
  for (let i = 0; i < n; i++) {
    try { v.currentTime = Math.min(m.dur - .05, (i + .5) * m.dur / n); await waitEvent(v, 'seeked', 'error', 4000); m.thumbs.push(thumbOf(v, m.w, m.h)); } catch (e) { break; }
    if (i === 0 || i === n - 1) tlDirty = true;
  }
  m.thumbT = n; tlDirty = true; v.removeAttribute('src'); v.load();
}
async function importFiles(files, opts = {}) {
  const added = [];
  for (const f of files) {
    const kind = kindOf(f); if (!kind) { toast(`“${f.name}” isn't a video, picture or audio file.`, true); continue; }
    const meta = { id: uid(), kind, name: f.name || kind, type: f.type || '' };
    try { const m = await loadMedia(meta, f); P.media.push({ id: m.id, kind, name: m.name, type: m.type, w: m.w, h: m.h, dur: m.dur }); added.push(m); idbReq('media', 'readwrite', s => s.put(f, m.id)).catch(() => { }); }
    catch (e) { toast(`Couldn't open “${f.name}”. ${kind === 'video' ? 'It may use a codec this phone can\'t play (try MP4/H.264).' : ''}`, true); }
  }
  return added;
}

async function deleteProject(id) { const list = await listProjects(); const p = list.find(x => x.id === id); try { await idbReq('projects', 'readwrite', s => s.delete(id)); if (p) for (const m of p.media) await idbReq('media', 'readwrite', s => s.delete(m.id)); } catch (e) { } toast('Project deleted'); }
function loadExample() {
  pause(); P = newProject(); P.demo = true; P.name = 'Example: Saturn fact';
  const gm = [['cosmos', 'Space shot'], ['racer', 'Fast car'], ['lab', 'Atom spin']].map(([gen, name]) => ({ id: 'gen-' + gen, kind: 'gen', gen, name, w: 540, h: 960 }));
  gm.forEach(m => { P.media.push(m); loadMedia(m); media[m.id].thumbs = [thumbOf(genFrame(m, 1), 540, 960)]; });
  const clip = (m, d, extra) => Object.assign({ id: uid(), m, in: 0, out: d, speed: 1, vol: 1, kb: 'in', kbAmt: .1, fit: 'fill', tr: { type: 'cut', d: .3 }, fx: {}, intro: 'none' }, extra);
  P.main = [clip('gen-cosmos', 3.2, { tr: { type: 'zoomin', d: .25 }, intro: 'zoom', introD: .3 }), clip('gen-racer', 3, { kb: 'none', tr: { type: 'flash', d: .3 }, fx: { mblur: .6 } }), clip('gen-lab', 3.4, { kb: 'drift' })];
  const f = TEXT_STYLES.fact; const { name, ...fs } = f; const tx = (text, start, dur) => Object.assign({ id: uid(), text, start, dur, x: .5, intro: 'pop', outro: 'fade', introD: .25, outroD: .15 }, fs);
  P.text = [tx("Saturn's rings are mostly ice", .2, 2.8), tx('and they are slowly vanishing', 3.15, 2.6), tx('gone in 300 million years', 5.95, 3.3)];
  P.vfx = [{ id: uid(), type: 'punch', start: 2.95, dur: .5, k: .6 }, { id: uid(), type: 'sparkle', start: 6, dur: 3.3, k: .5 }, { id: uid(), type: 'vignette', start: 0, dur: 9.3, k: .45 }];
  { const L = mainLayout(), c1 = L[1].start + trDur(0) / 2, c2 = L[2].start + trDur(1) / 2; P.aud = [Object.assign(newAud('sfx:whoosh', sfxAt('whoosh', c1)), {}), Object.assign(newAud('sfx:hit', sfxAt('hit', c2)), {}), Object.assign(newAud('sfx:riser', sfxAt('riser', c2)), { vol: .45 }), Object.assign(newAud('sfx:ding', 8.2), { vol: .55 })]; }
  sel = null; hist.undo = []; hist.redo = []; $('#projName').value = P.name; afterChange(); $('#saveState').textContent = 'Example'; sizePreview(); fitTimeline(); renderTools(); ensureFonts(); seek(0);
}

/* ============ Wiring & boot ============ */
$('#playBtn').onclick = togglePlay;
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
$('#exportBtn').onclick = () => { if (sel) select(null); openSheet('export'); };
$('#projName').addEventListener('input', e => mutate(() => P.name = e.target.value || 'Untitled edit', 'name'));
window.addEventListener('resize', () => { sizePreview(); tlDirty = true; });
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') delSel();
  else if (e.key === 's') splitSel();
  else if (e.key === 'ArrowLeft') seek(clock.t - (e.shiftKey ? 1 : 1 / (P.fps || 30)));
  else if (e.key === 'ArrowRight') seek(clock.t + (e.shiftKey ? 1 : 1 / (P.fps || 30)));
  else if (e.key === 'Escape') { sheet ? closeSheet() : select(null); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveNow(); if (playing && !exporting) pause(); } });
window.addEventListener('pagehide', () => saveNow());
(async function boot() {
  renderTools(); sizePreview(); requestAnimationFrame(tick);
  await Promise.all([idbOpen(), loadSfx()]); let last = null; try { last = localStorage.getItem('cl.last'); } catch (e) { }
  const list = await listProjects();
  if (!(last && list.find(p => p.id === last) && await openProject(last, true))) loadExample();
  if (document.fonts) document.fonts.ready.then(markDirty);
})();
</script>
