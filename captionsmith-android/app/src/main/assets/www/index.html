<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181e">
<style>html,body{margin:0}</style>
</head>
<body>
<title>Captionsmith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700;1,900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700;1,900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Archivo+Black&family=Bangers&family=Permanent+Marker&family=Lilita+One&display=swap">
<style>
/* Layout: phone-first editor. Stage (preview + transport + timeline) pinned on top, tabbed tool panel scrolls below; side-by-side from 900px. Deliberately single dark theme, like most video tools. */
:root{
  --bg:#0e1014; --panel:#15181e; --raise:#1d2129; --raise2:#262b35; --line:#2e3440;
  --fg:#e8eaee; --mute:#8d95a5; --dim:#5d6575;
  --accent:#ffc531; --accent-ink:#1b1500; --accent-soft:rgba(255,197,49,.14);
  --danger:#ff6b5e; --ok:#4fd18b; --info:#6fb6ff;
  --ui:"Familjen Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:10px;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:var(--ui);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.brand{font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:7px;white-space:nowrap}
.brand i{width:18px;height:12px;border-radius:3px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:2px;background:var(--accent-ink);border-radius:1px}
#projName{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;color:var(--fg);font-weight:500}
#projName:hover,#projName:focus{border-color:var(--line);background:var(--raise)}
.savestate{font-size:12px;color:var(--mute);white-space:nowrap}
.iconbtn{background:var(--raise);border:1px solid var(--line);border-radius:8px;min-width:36px;height:36px;display:inline-grid;place-items:center;padding:0 8px;color:var(--fg)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.layout{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line)}
.viewer{position:relative;display:grid;place-items:center;padding:8px 16px 0;height:min(38vh,520px)}
#preview{display:block;background:#000;border-radius:6px;touch-action:none;max-width:100%;max-height:100%}
.cmpbar{position:absolute;left:16px;right:16px;top:12px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;pointer-events:none}
.cmpbar>*{pointer-events:auto}
.cmpbar .lbl{background:rgba(0,0,0,.72);padding:4px 10px;border-radius:99px;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmpbar .pill{padding:4px 10px;font-size:12px}
.pill{border:1px solid var(--line);background:var(--raise);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.pill.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.transport{display:flex;align-items:center;gap:8px;padding:8px 16px 4px}
#playBtn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;flex:0 0 auto}
#playBtn svg{width:20px;height:20px;fill:currentColor}
.tc{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.tc span{color:var(--mute)}
.transport .grow{flex:1}
.tlwrap{position:relative;padding:4px 16px 8px}
#timeline{display:block;width:100%;height:96px;border-radius:8px;background:var(--panel);touch-action:none}
.tltools{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tltools .hint{font-size:12px;color:var(--mute);margin-left:auto}

.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);flex:0 0 auto;scrollbar-width:none;padding:0 8px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:12px 12px 10px;color:var(--mute);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabbody{flex:1;min-height:0;overflow-y:auto;padding-block:14px 40px;padding-inline:16px;-webkit-overflow-scrolling:touch}
.tabpane{display:flex;flex-direction:column;gap:14px;max-width:760px}

h3{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.card{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0;color:var(--mute);font-size:14px}
.note{font-size:13px;color:var(--mute);margin:0}
.note b{color:var(--fg);font-weight:600}
.warnnote{font-size:13px;margin:0;padding:9px 11px;border-radius:8px;background:rgba(255,107,94,.1);border:1px solid rgba(255,107,94,.35);color:#ffc2bc}
.oknote{font-size:13px;margin:0;padding:9px 11px;border-radius:8px;background:rgba(79,209,139,.1);border:1px solid rgba(79,209,139,.3);color:#bfeed4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.btn{background:var(--raise2);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-weight:600;font-size:14px;color:var(--fg);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:#3b4251}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;background:none;border:0;border-radius:7px;padding:7px 8px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raise2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.seg button:disabled{opacity:.35}

.field{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;min-height:34px}
.field>label{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:5px}
.field>label .ov{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.field .val{font-family:var(--mono);font-size:12px;color:var(--fg);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field select,.field input[type=text],.field input[type=number],textarea,.input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.colorctl{display:flex;gap:6px;align-items:center;min-width:0}
.colorctl input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg);flex:0 0 auto}
.colorctl input[type=text]{font-family:var(--mono);text-transform:uppercase;max-width:110px}
.colorctl.focused input[type=color]{box-shadow:0 0 0 2px var(--accent)}
.resetf{background:none;border:0;color:var(--accent);font-size:15px;padding:2px 4px;line-height:1}
details.grp{background:var(--raise);border:1px solid var(--line);border-radius:var(--r)}
details.grp>summary{list-style:none;padding:12px 14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"+";color:var(--mute);font-size:18px;line-height:1}
details.grp[open]>summary::after{content:"–"}
details.grp>.gbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.18);position:relative}
.swatch.add{background:var(--bg);color:var(--mute);display:grid;place-items:center;font-size:18px}

.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.preset{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0;overflow:hidden;text-align:left;position:relative}
.preset canvas{display:block;width:100%;aspect-ratio:16/10;height:auto}
.preset .pn{display:block;padding:6px 8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.preset .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);border:0;border-radius:6px;font-size:12px;padding:2px 6px;color:#fff}

.caplist{display:flex;flex-direction:column;gap:6px}
.cap{background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:9px 11px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;cursor:pointer;text-align:left}
.cap .ct{font-family:var(--mono);font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.cap .cx{grid-column:1/-1;font-size:15px;word-break:break-word}
.cap .sp{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--raise2);justify-self:start}
.cap.now{box-shadow:inset 3px 0 0 var(--ok)}
.cap.sel{border-color:var(--accent);cursor:default}
.capedit{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;margin-top:8px;cursor:auto}
.words{display:flex;flex-wrap:wrap;gap:5px}
.word{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:14px}
.word.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.word.hl{box-shadow:inset 0 -3px 0 var(--accent)}
.word.em::after{content:"✦";font-size:10px;margin-left:3px;vertical-align:top}
.timefield{display:flex;gap:4px;align-items:center}
.timefield input{font-family:var(--mono);font-size:13px;width:92px;text-align:center}
.timefield .btn{padding:6px 9px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.tgrid>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.tgrid label{font-size:12px;color:var(--mute)}

.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.method{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.method b{font-size:14px}
.method span{font-size:12.5px;color:var(--mute)}
.method[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.method .tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ok)}
.method .tag.ext{color:var(--info)}
.method .tag.off{color:var(--danger)}
textarea{resize:vertical;min-height:110px;line-height:1.45}

.progress{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.kbd{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px}
table.keys{border-collapse:collapse;font-size:14px;width:100%}
table.keys td{padding:5px 4px;border-bottom:1px solid var(--line)}
table.keys td:first-child{white-space:nowrap;width:1%;padding-right:14px}

.empty{position:absolute;inset:8px 16px 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding:0 12px 14px;pointer-events:none}
.empty>*{pointer-events:auto}
.empty .badge{background:rgba(0,0,0,.7);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--mute)}
.dragover #preview{outline:2px dashed var(--accent);outline-offset:4px}

#tapOverlay{position:fixed;inset:0;z-index:30;background:rgba(10,12,16,.96);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);gap:12px}
#tapOverlay .tapvideo{flex:0 1 38vh;min-height:0;display:grid;place-items:center}
#tapOverlay canvas{max-width:100%;max-height:100%;border-radius:6px}
#tapOverlay .upcoming{font-size:22px;line-height:1.35;text-align:center;min-height:2.8em}
#tapOverlay .upcoming b{color:var(--accent)}
#tapOverlay .upcoming span{color:var(--dim)}
#tapBig{flex:1 1 auto;min-height:120px;border-radius:16px;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:26px;font-weight:700;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#tapBig:active{background:var(--accent);color:var(--accent-ink)}

.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal .card{max-width:440px;width:100%}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:50;background:#2a303b;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.err{border-color:var(--danger);background:#3a2020}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#vid{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
.hide-phone{display:none}
#guidesBtn[aria-pressed="true"]{color:var(--accent);border-color:rgba(255,197,49,.5)}
@media (max-width:560px){
  .brand .bt{display:none}
  .savestate{font-size:11px;max-width:84px;overflow:hidden;text-overflow:ellipsis}
  .transport{gap:6px}
  .tc{font-size:12px}
  .iconbtn{min-width:34px;height:34px;padding:0 6px}
  .tltools .hint{display:none}
  .field{grid-template-columns:96px 1fr auto}
}
@media (min-width:900px){
  .layout{flex-direction:row}
  .stage{flex:1 1 60%;min-width:0;display:flex;flex-direction:column;border-bottom:0;border-right:1px solid var(--line)}
  .viewer{flex:1;height:auto;min-height:0}
  .panel{flex:0 0 min(470px,40%)}
  .hide-phone{display:inline}
}
</style>

<div id="app">
  <header class="topbar">
    <span class="brand"><i></i><span class="bt">Captionsmith</span></span>
    <input id="projName" aria-label="Project name" value="Untitled project">
    <span class="savestate" id="saveState">Not saved yet</span>
    <button class="iconbtn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="iconbtn" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  </header>

  <div class="layout">
    <section class="stage" aria-label="Preview">
      <div class="viewer" id="viewer">
        <canvas id="preview" aria-label="Video preview with captions"></canvas>
        <div class="cmpbar" id="cmpBar" hidden>
          <span class="lbl" id="cmpLabel">Comparing</span>
          <button class="pill" id="cmpMode">Split view</button>
          <button class="pill" id="cmpCancel">Cancel</button>
          <button class="pill primary" id="cmpApply">Apply</button>
        </div>
        <div class="empty" id="emptyState">
          <span class="badge">Demo captions — upload a video to start</span>
          <button class="btn primary" id="uploadBtn2">Choose a video</button>
        </div>
      </div>
      <div class="transport">
        <button id="playBtn" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l13-7.5z"/></svg></button>
        <span class="tc" id="timeNow">00:00.00 <span>/ 00:00.00</span></span>
        <span class="grow"></span>
        <button class="iconbtn" id="stepBack" title="Back one frame (,)" aria-label="Back one frame"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="iconbtn" id="stepFwd" title="Forward one frame (.)" aria-label="Forward one frame"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="iconbtn" id="guidesBtn" title="Show safe-area guides (G)" aria-label="Show safe-area guides" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg></button>
        <button class="iconbtn" id="uploadBtn" title="Open a video" aria-label="Open a video"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/></svg></button>
      </div>
      <div class="tlwrap">
        <canvas id="timeline" aria-label="Timeline: tap to seek, drag the selected caption to move it, drag its edges to resize"></canvas>
        <div class="tltools">
          <button class="btn small" id="zoomOut" aria-label="Zoom out">−</button>
          <button class="btn small" id="zoomIn" aria-label="Zoom in">+</button>
          <button class="btn small" id="zoomFit">Fit</button>
          <button class="btn small danger" id="removeVid" hidden>Remove video</button>
          <span class="hint" id="tlHint">Tap to seek · select a caption to drag it</span>
        </div>
      </div>
    </section>

    <section class="panel" aria-label="Editor">
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="captions" aria-selected="true">Captions</button>
        <button class="tab" role="tab" data-tab="style" aria-selected="false">Style</button>
        <button class="tab" role="tab" data-tab="animate" aria-selected="false">Animate</button>
        <button class="tab" role="tab" data-tab="layout" aria-selected="false">Layout</button>
        <button class="tab" role="tab" data-tab="export" aria-selected="false">Export</button>
        <button class="tab" role="tab" data-tab="help" aria-selected="false">Setup &amp; help</button>
      </nav>
      <div class="tabbody" id="tabBody"></div>
    </section>
  </div>
</div>

<div id="tapOverlay" hidden>
  <div class="row"><b class="grow">Tap to time</b><span class="tc" id="tapTime">00:00.00</span><button class="btn small" id="tapUndo">Undo tap</button><button class="btn small" id="tapDone">Done</button><button class="btn small" id="tapCancel">Cancel</button></div>
  <div class="tapvideo"><canvas id="tapCanvas"></canvas></div>
  <div class="upcoming" id="tapUpcoming"></div>
  <button id="tapBig">Start playback</button>
  <p class="note" id="tapNote">Press the big button when each word starts. Space bar works too.</p>
</div>

<div id="modalHost"></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="fileInput" accept="video/*,.mp4,.mov,.m4v,.webm,.mkv" class="sr">
<input type="file" id="subInput" accept=".srt,.vtt,.json,.txt,text/plain,application/json" class="sr">
<input type="file" id="projInput" accept=".json,application/json" class="sr">
<video id="vid" playsinline preload="auto"></video>
<script>
'use strict';
/* ============ Utilities ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
