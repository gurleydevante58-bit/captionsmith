name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's runners already include the Android SDK, so no setup step is needed
      - name: Build the APK
        working-directory: captionsmith-android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Cutline.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Cutline-apk
          path: Cutline.apk

      - name: Publish as a download (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cutline build ${{ github.run_number }}
          files: Cutline.apk
          make_latest: true
